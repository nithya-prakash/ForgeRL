name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: {MLFLOW_DISABLE_AGENT_HINT: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv lock --check         # lockfile consistent with pyproject.toml
      - run: uv sync --frozen        # fails if uv.lock is out of date (CPU torch on Linux)
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest -q        # unit, env check, CP-SAT, PPO smoke (no long training)
      - name: CLI smoke test
        run: uv run factory-scheduler benchmark --n-seeds 1 --scenarios stable --policies FIFO ATC --name ci_smoke
